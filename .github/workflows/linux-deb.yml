name: linux-deb
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-dev librime-bin gcc python3 fakeroot dpkg-dev
      - name: build
        run: bash linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kinfx-input-deb
          path: linux/build/*.deb
