name: linux-deb
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: install git (checkout needs it in the container)
        run: |
          apt-get update
          apt-get install -y ca-certificates git
      - uses: actions/checkout@v4
      - name: build deps (librime 1.16 from noble+1, matching the .deb dep)
        run: |
          apt-get install -y librime-dev librime-bin librime-plugin-lua gcc python3 fakeroot dpkg-dev
      - name: build
        run: bash linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kinfx-input-deb
          path: linux/build/*.deb
