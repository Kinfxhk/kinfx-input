# KINFX Input punctuation preset — shared by all three shells (windows build.cmd, mac/build.sh and
# linux/build-deb.sh copy engine/prelude/*.yaml verbatim), so one edit here reaches every platform.
# encoding: utf-8
#
# Hard rule: one key = one character. No entry may be a list of options — a list turns the key into
# a candidate menu that has to be picked, which is exactly the "choose full-width or half-width every
# time" the user complained about. Symbols that are not listed fall through to plain ASCII.
# Rare symbols (【〔［, ￥€£, ×※❂) have no table here by design.

full_shape:
  ' ' : { commit: '　' }
  ',' : { commit: '，' }
  '.' : { commit: '。' }
  '?' : { commit: '？' }
  '!' : { commit: '！' }
  ';' : { commit: '；' }
  ':' : { commit: '：' }
  '(' : { commit: '（' }
  ')' : { commit: '）' }
  '[' : { commit: '「' }
  ']' : { commit: '」' }
  '{' : { commit: '『' }
  '}' : { commit: '』' }
  '<' : { commit: '《' }
  '>' : { commit: '》' }
  "\\" : { commit: '、' }
  "'" : { pair: [ '‘', '’' ] }
  '"' : { pair: [ '“', '”' ] }
  '/' : { commit: '／' }
  '-' : { commit: '－' }
  '_' : { commit: '＿' }
  '+' : { commit: '＋' }
  '=' : { commit: '＝' }
  '~' : { commit: '～' }
  '$' : { commit: '＄' }
  '%' : { commit: '％' }
  '@' : { commit: '＠' }
  '#' : { commit: '＃' }
  '^' : { commit: '＾' }
  '&' : { commit: '＆' }
  '*' : { commit: '＊' }
  '|' : { commit: '｜' }
  '`' : { commit: '｀' }

# 半形（預設）：同 Windows 速成一樣，標點直接出 ASCII，唔使揀、唔使切。
# 想要中文標點就 Shift+Space 切全形（上面 full_shape）。
half_shape:
  ' ' : { commit: ' ' }
  ',' : { commit: ',' }
  '.' : { commit: '.' }
  '?' : { commit: '?' }
  '!' : { commit: '!' }
  ';' : { commit: ';' }
  ':' : { commit: ':' }
  '(' : { commit: '(' }
  ')' : { commit: ')' }
  '[' : { commit: '[' }
  ']' : { commit: ']' }
  '{' : { commit: '{' }
  '}' : { commit: '}' }
  '<' : { commit: '<' }
  '>' : { commit: '>' }
  "\\" : { commit: "\\" }
  "'" : { commit: "'" }
  '"' : { commit: '"' }
  '/' : { commit: '/' }
  '-' : { commit: '-' }
  '_' : { commit: '_' }
  '+' : { commit: '+' }
  '=' : { commit: '=' }
  '~' : { commit: '~' }
  '$' : { commit: '$' }
  '%' : { commit: '%' }
  '@' : { commit: '@' }
  '#' : { commit: '#' }
  '^' : { commit: '^' }
  '&' : { commit: '&' }
  '*' : { commit: '*' }
  '|' : { commit: '|' }
  '`' : { commit: '`' }

