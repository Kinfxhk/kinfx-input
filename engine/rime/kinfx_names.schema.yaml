# encoding: utf-8
# Dependency-only schema: makes the deployer compile kinfx_names (brand /
# product / website names, v0.5.4) into a native table for kinfx_quick.
# Not meant to be selected. MIT (project LICENSE); data: lexicon/NOTICE (Wikidata CC0).

schema:
  schema_id: kinfx_names
  name: KINFX 品牌名（內部）
  version: "0.5.4"
  description: kinfx_quick 用嘅品牌／網站名表，唔使單獨揀。

engine:
  processors:
    - speller
    - selector
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: kinfx_names
  enable_user_dict: false
