# encoding: utf-8
# Dependency-only schema: makes the deployer compile kinfx_quick_phrase
# (HK words + 4-character idioms) into a native table for kinfx_quick.
# Not meant to be selected. MIT (project LICENSE); data: lexicon/NOTICE.

schema:
  schema_id: kinfx_phrase
  name: KINFX 詞庫（內部）
  version: "0.4.1"
  description: kinfx_quick 用嘅詞庫表，唔使單獨揀。

engine:
  processors:
    - speller
    - selector
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: kinfx_quick_phrase
  enable_user_dict: false
